---
name: Analyse and Test

on:
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  # On the main branch we want all builds to complete, even if new commits are merged.
  group: ${{ github.ref == 'refs/heads/main' && format('lint-main-{0}', github.run_id) || format('lint-{0}-lint', github.ref) }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'

    - name: Install Composer dependencies
      run: composer install

    - name: Run PHP CodeSniffer
      run: composer lint

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'
        extensions: none, Core, ctype, curl, date, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, mysqlnd, openssl, pcntl, pcre, PDO, Phar, posix, random, readline, Reflection, session, SimpleXML, SPL, standard, tokenizer, xdebug, xml, xmlreader, xmlwriter, zip, zlib
        ini-values: opcache.save_comments=1
        coverage: xdebug

    - name: Composer Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.cache-composer
        key: ${{ runner.os }}-${{ hashFiles('./vendor/composer.lock') }}

    - name: Install Composer dependencies
      run: composer install

    - name: Show Composer dependencies
      run: composer show

    - name: PHPStan version
      run: ./vendor/bin/phpstan --version

    - name: Run PHPStan
      run: composer stan

  phpunit:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.3'
        extensions: pdo, zip
        ini-values: opcache.save_comments=1
        coverage: xdebug

    - name: Composer Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.cache-composer
        key: ${{ runner.os }}-${{ hashFiles('./vendor/composer.lock') }}

    - name: Install Composer dependencies
      run: composer install

    - name: Run PHPUnit
      run: composer test
